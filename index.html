<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a77a22">
<meta name="description" content="EVENT FAVOURS: bomboniere curate con amore per ogni occasione.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/app-icon-192.png">
<link rel="canonical" href="https://eventfovoursstore-napoli.github.io/event-fovours/shop/">
<meta http-equiv="refresh" content="0; url=./shop/">
<title>EVENT FAVOURS — Bomboniere per ogni occasione</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 28%,#fffdf8,#f6ecdc);color:#4b351d;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(100%,390px);padding:30px 24px;text-align:center;border:1px solid #ead8b8;border-radius:28px;background:#fffefa;box-shadow:0 18px 50px #593e1714}.logo{width:min(100%,255px);height:auto;object-fit:contain}.spinner{width:22px;height:22px;margin:20px auto 12px;border:2px solid #ead8b8;border-top-color:#a77a22;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}a{display:inline-flex;margin-top:10px;padding:10px 18px;border-radius:999px;background:#a77a22;color:white;text-decoration:none;font-weight:700}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="./assets/event-favours-logo.jpg" alt="EVENT FAVOURS">
<div class="spinner" aria-hidden="true"></div>
<p role="status">Ti stiamo accompagnando alla vetrina…</p>
<a href="./shop/">Apri la vetrina</a>
</main>
<script>
const target=new URL('./shop/',location.href);
target.search=location.search;
target.hash=location.hash;
location.replace(target.href);
</script>
</body>
</html>
